name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # Compila el proyecto
  build:
    runs-on: ubuntu-latest
    container: gradle:jdk17-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            build
            .gradle
            Dockerfile
          key: gradle-cache-${{ github.ref_name }}

      - name: Build JAR
        run: gradle --no-daemon bootJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar

  # Compila Docker y lo sube al Docker Registry
  deploy:
    runs-on: ubuntu-latest
    needs: build
    services:
      docker:
        image: docker:dind
        options: --privileged
    env:
      DOCKER_HOST: tcp://localhost:2375
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore Gradle cache
        uses: actions/cache@v3
        with:
          path: |
            build
            .gradle
            Dockerfile
          key: gradle-cache-${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}
          registry: ${{ secrets.CI_REGISTRY }}

      - name: Build and Push Docker Image
        run: |
          docker build --pull --tag="${{ secrets.CI_REGISTRY_IMAGE }}:latest" .
          docker push "${{ secrets.CI_REGISTRY_IMAGE }}:latest"