spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

springdoc:
  swagger-ui:
    urls:
      - name: "DEV SERVER"
        url: "http://localhost:8080/v3/api-docs"
      - name: "PROD SERVER"
        url: "https://juanjosejaen.com/v3/api-docs"
    tryItOutEnabled: true
