spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

server:
  forward-headers-strategy: framework  # Asegura que detecte HTTPS correctamente detrás de un proxy

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tryItOutEnabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  show-actuator: true
